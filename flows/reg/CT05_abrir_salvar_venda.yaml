appId: ${APP_ID}
name: "CT05 - Abrir e salvar formulario de CPQ em branco: Venda"
tags:
  - build263
  - P0
  - REG
env:
  ENTIDADE: Venda
---
# Pre: Venda com modelo que tem formulario de CPQ em branco publicado.
# Esperado: formulario abre na web view e o registro e salvo na estrutura
# nativa do Ploomes com todos os dados preenchidos.
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/abrir_nova_entidade.yaml
    env:
      ENTIDADE: ${ENTIDADE}
- runFlow: ../../subflows/assert_webview_carregada.yaml
- takeScreenshot: build${BUILD}_CT05_form_aberto
- runFlow: ../../subflows/preencher_formulario_cpq.yaml
- runFlow: ../../subflows/salvar.yaml
# confirma que o registro criado aparece na listagem da entidade
- extendedWaitUntil:
    visible:
      text: ${VALOR_CAMPO_TEXTO}
    timeout: 30000
- takeScreenshot: build${BUILD}_CT05_registro_salvo
