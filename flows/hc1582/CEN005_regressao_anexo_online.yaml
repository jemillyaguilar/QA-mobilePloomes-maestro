appId: ${APP_ID}
name: "CEN-005 - Regressao do anexo online (CT-OBS-001)"
tags: [hc1582, P1, CRITICO, regressao]
---
# Pre: app logado na Conta Teste QA CPQ (login manual), com internet.
# Independente dos outros cenarios: parte do cliente com o arquivo-B.pdf.
- setAirplaneMode: disabled
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: tab-bar-button-clients
    timeout: 120000
# se uma execucao anterior deixou o app em modo off-line, o anexo viraria
# pendencia e o teste passaria sem testar o on-line
- runFlow: ../../subflows/hc1582/garantir_online.yaml
- runFlow: ../../subflows/fechar_novidades.yaml
- runFlow:
    file: ../../subflows/hc1582/preparar_anexo_online.yaml
    env:
      ONDE: clientes
      NOME: ${CLIENTE_NOME}
      ARQUIVO: ${ARQ_B}
- runFlow:
    file: ../../subflows/hc1582/abrir_registro.yaml
    env:
      ONDE: clientes
      NOME: ${CLIENTE_NOME}
- runFlow:
    file: ../../subflows/hc1582/anexar_imagem_e_pdf.yaml
    env:
      PASSO: CEN005_cliente
# de volta na ficha: salvo sem pendencia (aviso no topo, antes de rolar) e o
# PDF novo no lugar do B (o Anexo QA fica abaixo da imagem)
- assertVisible: "Imagem QA.*"
- assertNotVisible: "Possui dados n.o sincronizados"
- scrollUntilVisible:
    element: ".*${ARQ_PDF}.*"
    direction: DOWN
    timeout: 60000
- assertNotVisible: ".*${ARQ_B}.*"
- takeScreenshot: b${BUILD}_CEN005_cliente_salvo
