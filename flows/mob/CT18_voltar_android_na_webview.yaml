appId: ${APP_ID}
name: "CT18 - Botao/gesto de voltar do Android dentro da web view"
tags:
  - build263
  - P0
  - MOB
  - android
env:
  ENTIDADE: Proposta
---
# Esperado: voltar retorna um passo DENTRO do formulario; sair sem salvar
# pede confirmacao de descarte em vez de perder os dados sem aviso.
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/abrir_nova_entidade.yaml
    env:
      ENTIDADE: ${ENTIDADE}
- runFlow: ../../subflows/assert_webview_carregada.yaml
- runFlow: ../../subflows/preencher_formulario_cpq.yaml
- takeScreenshot: build${BUILD}_CT18_1_form_preenchido
# voltar com dados preenchidos tem que pedir confirmacao
- back
- extendedWaitUntil:
    visible:
      text: ${TXT_CONFIRMA_DESCARTE}
    timeout: 15000
- assertVisible: ${TXT_CONFIRMA_DESCARTE}
- takeScreenshot: build${BUILD}_CT18_2_dialogo_de_descarte
# cancelar o descarte mantem os dados preenchidos
- tapOn:
    text: "Cancelar"
    optional: true
- assertVisible: ${VALOR_CAMPO_TEXTO}
- takeScreenshot: build${BUILD}_CT18_3_dados_mantidos
