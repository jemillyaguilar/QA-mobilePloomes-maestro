appId: ${APP_ID}
name: "CT32 - Produtos e tabela de precos dentro do formulario"
tags:
  - build263
  - P0
  - FUN
env:
  ENTIDADE: Proposta
  QUANTIDADE: "3"
  DESCONTO: "15"
---
# Esperado: adicionar produto, alterar quantidade e desconto recalcula o
# total corretamente, com moeda e arredondamento iguais aos da web.
# O VALOR do total e conferido na evidencia contra o calculo da web.
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/abrir_nova_entidade.yaml
    env:
      ENTIDADE: ${ENTIDADE}
- runFlow: ../../subflows/assert_webview_carregada.yaml
- tapOn:
    id: ${SEL_BUSCA_PRODUTO}
- inputText: ${NOME_PRODUTO}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: ${NOME_PRODUTO}
    timeout: 20000
- tapOn: ${NOME_PRODUTO}
- assertVisible:
    id: ${SEL_TOTAL}
- takeScreenshot: build${BUILD}_CT32_1_produto_adicionado
- tapOn:
    id: ${SEL_CAMPO_QTD}
- eraseText
- inputText: ${QUANTIDADE}
- hideKeyboard
- takeScreenshot: build${BUILD}_CT32_2_total_apos_quantidade
- tapOn:
    id: ${SEL_CAMPO_DESCONTO}
- eraseText
- inputText: ${DESCONTO}
- hideKeyboard
- takeScreenshot: build${BUILD}_CT32_3_total_apos_desconto
- runFlow: ../../subflows/salvar.yaml
- takeScreenshot: build${BUILD}_CT32_4_salvo_com_produtos
