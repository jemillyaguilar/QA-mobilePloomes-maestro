# Configuração da suíte Maestro — CPQ em Branco / Web View / Tirador de Pedidos
# Referência: HC-29  |  Confluence: Casos de Teste Complementares — CPQ em Branco
flows:
  - "../flows/**"

# Executa os subflows apenas quando chamados por runFlow (nunca isolados)
includeTags: []
excludeTags:
  - subflow
  # flows bloqueados (decisao de produto ou referencia pendente) nao rodam
  # na pasta inteira; para rodar um deles, chamar o arquivo direto
  - bloqueado
